name: PR 2 named regression suites
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_BUILD_JOBS: 3
jobs:
  pr2-named-suites:
    name: PR 2 exact-head named suites
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cffda0353e615f764730f0395787f98b0b52cc93
      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = cffda0353e615f764730f0395787f98b0b52cc93
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: core
      - name: Document, harness, engine and named protocol/integration suites
        run: >-
          cargo test --locked
          -p zeron-doc -p zeron-harness -p zeron-engine --lib
          --test claude --test codex --test acp --test e2e
          --test codex_subagents --test subagent_idle_reap
          --test restart_resume --test side_chats --test claude_subagents
          -- --test-threads=1
