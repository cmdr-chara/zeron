name: Remote sync base-head captures
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote-sync-captures:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_BUILD_JOBS: 3
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CAPTURE_OUTPUT: ${{ runner.temp }}/remote-sync-comparison
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Rust toolchain
        run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: remote-sync-captures-v1
          save-if: 'true'
          cache-on-failure: true
      - name: Capture exact PR base and head with the same fixture
        run: python3 scripts/ci/capture-remote-sync-comparison.py
      - name: Upload base-head captures and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-sync-base-head
          path: |
            ${{ runner.temp }}/remote-sync-comparison/*.json
            ${{ runner.temp }}/remote-sync-comparison/*.log
            ${{ runner.temp }}/remote-sync-comparison/*.patch
            ${{ runner.temp }}/remote-sync-comparison/*.rs
            ${{ runner.temp }}/remote-sync-comparison/base/*.png
            ${{ runner.temp }}/remote-sync-comparison/head/*.png
          if-no-files-found: error
          retention-days: 14
