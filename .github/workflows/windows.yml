name: Cursor shim concurrency diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
jobs:
  diagnose-cursor-shim:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check that the isolated source path is unused
        run: if (Test-Path -LiteralPath source) { throw 'source path already exists' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ed727354191f847480fe81b17dc3be703d2c2cbd
          path: source
      - name: Verify exact PR 1 source
        working-directory: source
        run: if ((git rev-parse HEAD).Trim() -ne 'ed727354191f847480fe81b17dc3be703d2c2cbd') { throw 'Unexpected source revision' }
      - uses: ./.github/actions/windows-ci-setup
      - name: Compile the original Cursor test binary
        working-directory: source
        run: |
          cargo test --release --locked -p zeron-harness --features native-fixture --test cursor_shim --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare 20 default, four-thread and serial runs
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'cursor-shim-diagnostics'
          if (Test-Path -LiteralPath $out) { throw 'Diagnostic output already exists' }
          New-Item -ItemType Directory -Path $out | Out-Null
          $summary = Join-Path $out 'results.csv'
          'round,mode,exit_code,elapsed_seconds' | Set-Content -LiteralPath $summary
          "Logical processors: $([Environment]::ProcessorCount)" | Set-Content -LiteralPath (Join-Path $out 'runner.txt')
          $failedTrials = 0
          $modes = @('default', '4', '1')
          $cargoPath = (Get-Command cargo).Source
          $sourcePath = Join-Path $env:GITHUB_WORKSPACE 'source'
          foreach ($round in 1..20) {
            $offset = ($round - 1) % 3
            foreach ($n in 0..2) {
              $mode = $modes[($offset + $n) % 3]
              $arguments = @('test', '--release', '--locked', '-p', 'zeron-harness', '--features', 'native-fixture', '--test', 'cursor_shim', '--')
              if ($mode -ne 'default') { $arguments += "--test-threads=$mode" }
              $arguments += @('--skip', 'stress_100_interrupted_sessions_recover_without_losing_history_or_replaying', '--nocapture')
              $base = Join-Path $out "round-$round-mode-$mode"
              $watch = [System.Diagnostics.Stopwatch]::StartNew()
              $trial = Start-Process -FilePath $cargoPath -ArgumentList $arguments -WorkingDirectory $sourcePath -NoNewWindow -Wait -PassThru -RedirectStandardOutput "$base.out" -RedirectStandardError "$base.err"
              $watch.Stop()
              $seconds = [Math]::Round($watch.Elapsed.TotalSeconds, 3)
              "$round,$mode,$($trial.ExitCode),$seconds" | Add-Content -LiteralPath $summary
              Write-Host "round=$round mode=$mode exit=$($trial.ExitCode) seconds=$seconds"
              if ($trial.ExitCode -ne 0) { $failedTrials++ }
            }
          }
          Get-Content -LiteralPath $summary
          if ($failedTrials -gt 0) { throw "$failedTrials diagnostic trials failed" }
      - name: Upload diagnostic results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr1-cursor-shim-concurrency
          path: ${{ runner.temp }}/cursor-shim-diagnostics
          if-no-files-found: warn
          retention-days: 14
